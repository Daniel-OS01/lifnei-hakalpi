# Main nginx config for the static site. Runs as the unprivileged nginx user on 8080.
pid /var/run/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    # The path only ($uri), never the query string.
    log_format site '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout site;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store";
            return 200 "ok";
        }

        # Vite emits content-hashed files here.
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Generated data changes without a filename change: always revalidate.
        location ^~ /data/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        # Fonts served outside /assets/.
        location ~* \.(woff2?|ttf|otf)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
