name: link-check

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-data
      # The script always exits 0; dead links are reported, never a failed run.
      - run: npm run linkcheck
        continue-on-error: true
      - name: Open or update the report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "דוח קישורים שבורים";
            const body = fs.existsSync("link-report.md")
              ? fs.readFileSync("link-report.md", "utf8")
              : "קובץ הדוח לא נוצר. ראו את הלוג של הריצה.";
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
